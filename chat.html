<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KolKatha | Heritage Guide</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <style>
        :root {
            --bg-body: #121212;
            --bg-sidebar: #181818;
            --bg-main: #1F1F1F;
            --accent-primary: #D4A373;
            --text-main: #Eaeaea;
            --text-muted: #A0A0A0;
            --border-light: rgba(255, 255, 255, 0.08);
            --danger: #ff6b6b;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            height: 100vh;
            background: var(--bg-body);
            display: flex;
            justify-content: center;
            align-items: center;
            color: var(--text-main);
        }

        .wrapper {
            width: 95%;
            max-width: 1400px;
            height: 94vh;
            background: var(--bg-main);
            border-radius: 16px;
            display: flex;
            overflow: hidden;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.6);
            border: 1px solid var(--border-light);
        }

        .sidebar {
            width: 260px;
            background: var(--bg-sidebar);
            padding: 24px;
            display: flex;
            flex-direction: column;
            border-right: 1px solid var(--border-light);
        }

        .logo {
            color: var(--text-main);
            text-decoration: none;
            font-size: 18px;
            font-weight: 600;
            letter-spacing: -0.5px;
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 25px;
            opacity: 0.95;
        }

        .logo i {
            color: var(--accent-primary);
        }

        .new-chat-btn {
            width: 100%;
            padding: 12px 16px;
            border-radius: 8px;
            border: 1px solid var(--border-light);
            background: rgba(255, 255, 255, 0.03);
            color: var(--text-main);
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 20px;
        }

        .new-chat-btn:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(255, 255, 255, 0.15);
        }

        .history-label {
            font-size: 12px;
            color: var(--text-muted);
            font-weight: 600;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .history-list {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .history-item {
            padding: 10px 12px;
            border-radius: 6px;
            font-size: 14px;
            color: var(--text-muted);
            cursor: pointer;
            transition: background 0.2s;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: relative;
        }

        .history-text {
            display: flex;
            align-items: center;
            gap: 10px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            flex: 1;
        }

        .history-item:hover {
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-main);
        }

        .history-item.active {
            background: rgba(212, 163, 115, 0.15);
            color: var(--accent-primary);
        }

        .delete-chat-btn {
            opacity: 0;
            color: var(--danger);
            padding: 5px;
            border-radius: 4px;
            transition: all 0.2s;
            font-size: 12px;
            margin-left: 8px;
        }

        .history-item:hover .delete-chat-btn,
        .history-item.active .delete-chat-btn {
            opacity: 1;
        }

        .delete-chat-btn:hover {
            background: rgba(255, 107, 107, 0.15);
            transform: scale(1.1);
        }

        .history-list::-webkit-scrollbar {
            width: 4px;
        }

        .history-list::-webkit-scrollbar-thumb {
            background-color: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
        }

        .chat-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: var(--bg-main);
            position: relative;
        }

        .top-bar {
            height: 65px;
            padding: 0 40px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--border-light);
        }

        .top-bar-title {
            font-size: 15px;
            font-weight: 500;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .profile-btn {
            width: 36px;
            height: 36px;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.05);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: var(--text-muted);
            transition: all 0.2s;
            border: 1px solid transparent;
        }

        .profile-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            color: var(--text-main);
            border-color: var(--border-light);
        }

        .messages-container {
            flex: 1;
            padding: 30px 18%;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 30px;
        }

        .messages-container::-webkit-scrollbar {
            width: 6px;
        }

        .messages-container::-webkit-scrollbar-track {
            background: transparent;
        }

        .messages-container::-webkit-scrollbar-thumb {
            background-color: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
        }

        .message {
            max-width: 100%;
            line-height: 1.7;
            font-size: 15px;
            position: relative;
            word-wrap: break-word;
            display: flex;
            gap: 18px;
            align-items: flex-start;
        }

        .user-msg-wrapper {
            flex-direction: row-reverse;
            justify-content: flex-start;
            text-align: right;
        }

        .user-msg-wrapper .msg-content {
            align-items: flex-end;
        }

        .avatar {
            width: 32px;
            height: 32px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            font-size: 12px;
            font-weight: 700;
            transition: all 0.3s;
        }

        .ai-avatar {
            background: #2A2A2A;
            color: var(--accent-primary);
            border: 1px solid var(--border-light);
        }

        .user-avatar {
            background: var(--accent-primary);
            color: #121212;
        }

        @keyframes pulse-gold {
            0% {
                box-shadow: 0 0 0 0 rgba(212, 163, 115, 0.4);
                border-color: var(--accent-primary);
            }

            70% {
                box-shadow: 0 0 0 10px rgba(212, 163, 115, 0);
                border-color: var(--accent-primary);
            }

            100% {
                box-shadow: 0 0 0 0 rgba(212, 163, 115, 0);
                border-color: var(--border-light);
            }
        }

        .ai-thinking {
            animation: pulse-gold 2s infinite;
        }

        .msg-content {
            padding-top: 0px;
            color: var(--text-main);
            max-width: 85%;
            min-height: 32px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .msg-content h1,
        .msg-content h2,
        .msg-content h3 {
            color: var(--accent-primary);
            font-weight: 700;
            margin-top: 15px;
            margin-bottom: 8px;
            font-size: 17px;
            letter-spacing: 0.5px;
        }

        .msg-content h3:first-child {
            margin-top: 0;
        }

        .msg-content strong {
            color: var(--accent-primary);
            font-weight: 700;
        }

        .msg-content em {
            color: #ffe0b2;
            font-style: italic;
        }

        .msg-content ul,
        .msg-content ol {
            margin-left: 20px;
            margin-bottom: 15px;
            color: var(--text-muted);
        }

        .msg-content li {
            margin-bottom: 6px;
            padding-left: 5px;
        }

        .msg-content li::marker {
            color: var(--accent-primary);
        }

        .msg-content blockquote {
            border-left: 3px solid var(--accent-primary);
            padding-left: 15px;
            margin: 10px 0;
            color: #ccc;
            background: rgba(212, 163, 115, 0.1);
            border-radius: 0 8px 8px 0;
            padding: 8px 15px;
        }

        .msg-content p {
            margin-bottom: 12px;
        }

        .user-msg-wrapper .msg-content ul,
        .user-msg-wrapper .msg-content ol {
            text-align: right;
            margin-right: 20px;
            margin-left: 0;
            list-style-position: inside;
        }

        .input-area {
            padding: 30px 18%;
            background: var(--bg-main);
        }

        .input-wrapper {
            background: #2A2A2A;
            border: 1px solid var(--border-light);
            border-radius: 12px;
            padding: 10px 14px;
            display: flex;
            align-items: flex-end;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
            transition: border 0.2s, box-shadow 0.2s;
        }

        .input-wrapper:focus-within {
            border-color: var(--accent-primary);
            box-shadow: 0 4px 25px rgba(212, 163, 115, 0.1);
        }

        .input-wrapper input {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: #fff;
            font-size: 15px;
            padding: 8px;
        }

        .send-btn {
            width: 34px;
            height: 34px;
            background: var(--accent-primary);
            border-radius: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            color: #121212;
            font-size: 14px;
            transition: opacity 0.2s, transform 0.2s;
            margin-bottom: 2px;
        }

        .send-btn:hover {
            opacity: 0.9;
            transform: scale(1.05);
        }

        .typing {
            display: none;
            align-items: center;
            gap: 5px;
            margin-left: 65px;
            margin-bottom: 15px;
        }

        .typing span {
            width: 5px;
            height: 5px;
            background: var(--text-muted);
            border-radius: 50%;
            animation: blink 1.4s infinite;
            opacity: 0.4;
        }

        .typing span:nth-child(2) {
            animation-delay: 0.2s;
        }

        .typing span:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes blink {

            0%,
            100% {
                opacity: 0.4;
            }

            50% {
                opacity: 1;
            }
        }

        .modal {
            display: none;
            position: fixed;
            z-index: 3000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(4px);
            justify-content: center;
            align-items: center;
            animation: fadeIn 0.2s ease-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }

        @keyframes scaleIn {
            from {
                transform: scale(0.9);
                opacity: 0;
            }

            to {
                transform: scale(1);
                opacity: 1;
            }
        }

        .profile-card {
            background: #252525;
            width: 340px;
            border-radius: 16px;
            padding: 30px;
            border: 1px solid var(--border-light);
            text-align: center;
            position: relative;
            animation: scaleIn 0.2s ease-out;
        }

        .close-btn {
            position: absolute;
            top: 15px;
            right: 20px;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 18px;
        }

        .profile-pic {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            margin: 0 auto 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 30px;
            color: var(--accent-primary);
            border: 2px solid var(--accent-primary);
        }

        .profile-name {
            font-size: 20px;
            font-weight: 600;
            color: #fff;
            margin-bottom: 5px;
        }

        .profile-email {
            font-size: 14px;
            color: var(--text-muted);
            margin-bottom: 25px;
        }

        .logout-btn {
            width: 100%;
            padding: 12px;
            background: rgba(255, 107, 107, 0.1);
            color: #ff6b6b;
            border: 1px solid rgba(255, 107, 107, 0.2);
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .confirm-card {
            background: #252525;
            width: 320px;
            border-radius: 16px;
            padding: 25px;
            border: 1px solid var(--border-light);
            text-align: center;
            animation: scaleIn 0.2s ease-out;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
        }

        .confirm-icon {
            font-size: 40px;
            color: var(--danger);
            margin-bottom: 15px;
        }

        .confirm-title {
            font-size: 18px;
            font-weight: 600;
            color: #fff;
            margin-bottom: 10px;
        }

        .confirm-desc {
            font-size: 14px;
            color: var(--text-muted);
            margin-bottom: 25px;
            line-height: 1.5;
        }

        .confirm-actions {
            display: flex;
            gap: 15px;
            justify-content: center;
        }

        .btn-cancel {
            padding: 10px 20px;
            border-radius: 8px;
            border: 1px solid var(--border-light);
            background: transparent;
            color: var(--text-main);
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-cancel:hover {
            background: rgba(255, 255, 255, 0.05);
        }

        .btn-delete {
            padding: 10px 20px;
            border-radius: 8px;
            border: none;
            background: var(--danger);
            color: #fff;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 4px 12px rgba(255, 107, 107, 0.3);
        }

        .btn-delete:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(255, 107, 107, 0.4);
        }

        @media (max-width: 900px) {
            .wrapper {
                width: 100%;
                height: 100vh;
                border-radius: 0;
                border: none;
            }

            .sidebar {
                display: none;
            }

            .messages-container,
            .input-area {
                padding-left: 5%;
                padding-right: 5%;
            }
        }
    </style>
</head>

<body>

    <div class="wrapper">
        <div class="sidebar">
            <a href="index.html" class="logo">
                <i class="fa-solid fa-layer-group"></i> KolKatha
            </a>
            <button class="new-chat-btn" id="newChatBtn">
                <i class="fa-solid fa-plus"></i> New Chat
            </button>

            <div class="history-label">Recent</div>
            <div class="history-list" id="historyList">
            </div>
        </div>

        <div class="chat-area">
            <div class="top-bar">
                <div class="top-bar-title">
                    <i class="fa-solid fa-robot"></i> Heritage Guide 2.5
                </div>
                <div class="profile-btn" id="profileBtn">
                    <i class="fa-regular fa-user"></i>
                </div>
            </div>

            <div class="messages-container" id="chatContainer">
                <div class="message animate-msg">
                    <div class="avatar ai-avatar">AI</div>
                    <div class="msg-content">
                        Hello! I am your guide to Kolkata's heritage. How can I assist you today?
                    </div>
                </div>
                <div class="typing" id="typing">
                    <span></span><span></span><span></span>
                </div>
            </div>

            <div class="input-area">
                <div class="input-wrapper">
                    <input type="text" id="userInput" placeholder="Ask about Victoria Memorial, Food, or History..."
                        autofocus autocomplete="off">
                    <div class="send-btn" id="sendBtn">
                        <i class="fa-solid fa-arrow-up"></i>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="profileModal" class="modal">
        <div class="profile-card">
            <i class="fa-solid fa-xmark close-btn" id="closeProfile"></i>
            <div class="profile-pic"><i class="fa-solid fa-user"></i></div>
            <div class="profile-name" id="userNameModal">User Name</div>
            <div class="profile-email" id="userEmailModal">user@example.com</div>
            <button class="logout-btn" id="logout">
                <i class="fa-solid fa-arrow-right-from-bracket"></i> Sign Out
            </button>
        </div>
    </div>

    <div id="deleteModal" class="modal">
        <div class="confirm-card">
            <div class="confirm-icon"><i class="fa-solid fa-triangle-exclamation"></i></div>
            <div class="confirm-title">Delete Chat?</div>
            <div class="confirm-desc">This action cannot be undone. Are you sure you want to delete this conversation?
            </div>
            <div class="confirm-actions">
                <button class="btn-cancel" id="cancelDelete">Cancel</button>
                <button class="btn-delete" id="confirmDeleteBtn">Delete</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, query, where, orderBy, onSnapshot, doc, updateDoc, arrayUnion, deleteDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyC7rpZAOb34iUbXU9J9CflXjTFKgXRIeRE",
            authDomain: "indiaexplorer-e89b8.firebaseapp.com",
            projectId: "indiaexplorer-e89b8",
            storageBucket: "indiaexplorer-e89b8.firebasestorage.app",
            messagingSenderId: "689958927158",
            appId: "1:689958927158:web:0c4e58bf3cc9cae01a5197"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let currentUser = null;
        let currentChatId = null;
        let chatToDeleteId = null;

        const chatContainer = document.getElementById("chatContainer");
        const userInput = document.getElementById("userInput");
        const sendBtn = document.getElementById("sendBtn");
        const typing = document.getElementById("typing");
        const historyList = document.getElementById("historyList");
        const newChatBtn = document.getElementById("newChatBtn");

        onAuthStateChanged(auth, (user) => {
            if (user) {
                currentUser = user;
                loadSidebarHistory(user.uid);
                document.getElementById("userNameModal").textContent = user.displayName || "Explorer";
                document.getElementById("userEmailModal").textContent = user.email;

                const urlParams = new URLSearchParams(window.location.search);
                const autoMsg = urlParams.get('msg');
                if (autoMsg) {
                    userInput.value = autoMsg;
                    window.history.replaceState({}, document.title, window.location.pathname);
                    setTimeout(() => { handleSend(); }, 500);
                }
            } else {
                window.location.href = "login.html";
            }
        });

        function loadSidebarHistory(userId) {
            const chatsRef = collection(db, "users", userId, "chats");
            const q = query(chatsRef, orderBy("createdAt", "desc"));

            onSnapshot(q, (snapshot) => {
                historyList.innerHTML = "";
                snapshot.forEach((docSnapshot) => {
                    const data = docSnapshot.data();
                    const chatId = docSnapshot.id;

                    const item = document.createElement("div");
                    item.className = `history-item ${chatId === currentChatId ? 'active' : ''}`;
                    item.dataset.id = chatId;

                    item.innerHTML = `
                        <div class="history-text">
                            <i class="fa-regular fa-message"></i> ${data.title || "New Chat"}
                        </div>
                        <i class="fa-solid fa-trash delete-chat-btn" title="Delete Chat"></i>
                    `;

                    item.addEventListener("click", () => loadChat(chatId));

                    const deleteBtn = item.querySelector('.delete-chat-btn');
                    deleteBtn.addEventListener('click', (e) => {
                        e.stopPropagation();
                        openDeleteModal(chatId);
                    });

                    historyList.appendChild(item);
                });
            });
        }

        async function loadChat(chatId) {
            console.log("Loading chat:", chatId);
            currentChatId = chatId;

            document.querySelectorAll('.history-item').forEach(el => {
                el.classList.remove('active');
                if (el.dataset.id === chatId) el.classList.add('active');
            });

            chatContainer.innerHTML = "";
            chatContainer.appendChild(typing);
            typing.style.display = 'none';

            try {
                const chatRef = doc(db, "users", currentUser.uid, "chats", chatId);
                const docSnap = await getDoc(chatRef);

                if (docSnap.exists()) {
                    const data = docSnap.data();
                    if (data.messages && Array.isArray(data.messages)) {
                        data.messages.forEach(msg => {
                            if (!msg.text) return;
                            const role = msg.role === 'model' ? 'ai' : msg.role;
                            appendMessageToUI(msg.text, role, false);
                        });
                    }
                }
            } catch (error) {
                console.error("Error loading chat:", error);
            }
            scrollToBottom();
        }

        function resetToNewChat() {
            currentChatId = null;
            chatContainer.innerHTML = "";
            document.querySelectorAll('.history-item').forEach(el => el.classList.remove('active'));

            const welcomeDiv = document.createElement("div");
            welcomeDiv.className = "message animate-msg";
            welcomeDiv.innerHTML = `
                <div class="avatar ai-avatar">AI</div>
                <div class="msg-content">Hello. I am your guide to Kolkata's heritage. How can I assist you today?</div>
            `;
            chatContainer.appendChild(welcomeDiv);
            chatContainer.appendChild(typing);
            typing.style.display = "none";
        }

        newChatBtn.addEventListener("click", resetToNewChat);

        async function handleSend() {
            const text = userInput.value.trim();
            if (!text) return;

            appendMessageToUI(text, "user", false);
            userInput.value = "";

            typing.style.display = "flex";
            scrollToBottom();

            if (!currentChatId && currentUser) {
                try {
                    const docRef = await addDoc(collection(db, "users", currentUser.uid, "chats"), {
                        title: text.substring(0, 25) + (text.length > 25 ? "..." : ""),
                        createdAt: new Date(),
                        messages: []
                    });
                    currentChatId = docRef.id;
                    document.querySelectorAll('.history-item').forEach(el => el.classList.remove('active'));
                } catch (e) {
                    console.error("Error creating chat:", e);
                }
            }

            if (currentChatId) {
                const chatRef = doc(db, "users", currentUser.uid, "chats", currentChatId);
                await updateDoc(chatRef, { messages: arrayUnion({ role: "user", text: text }) });
            }

            try {
                const reply = await fetchReply(text);

                typing.style.display = "none";

                appendMessageToUI(reply, "ai", true);

                if (currentChatId) {
                    const chatRef = doc(db, "users", currentUser.uid, "chats", currentChatId);
                    await updateDoc(chatRef, { messages: arrayUnion({ role: "model", text: reply }) });
                }
            } catch (err) {
                console.error(err);
                typing.style.display = "none";
                appendMessageToUI("Sorry, I'm having trouble connecting to the server.", "ai", false);
            }
        }

        const API_URL = window.location.hostname === "localhost" || window.location.hostname === "127.0.0.1"
            ? "http://localhost:3000/chat"
            : "https://kolkata-explorer.onrender.com/chat"; // Use your actual Render URL here

        async function fetchReply(message) {
            const historyElements = document.querySelectorAll('.message .msg-content');
            const history = [];
            const limit = 6;
            const start = Math.max(0, historyElements.length - limit);

            for (let i = start; i < historyElements.length - 1; i++) {
                const wrapper = historyElements[i].closest('.message');
                const role = wrapper.classList.contains('user-msg-wrapper') ? 'user' : 'model';
                history.push({ role: role, parts: [{ text: historyElements[i].innerText }] });
            }

            const res = await fetch(API_URL, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ message, history })
            });

            if (!res.ok) throw new Error("Server error");
            const data = await res.json();
            return data.reply;
        }

        function appendMessageToUI(text, sender, animate = false) {
            const msgDiv = document.createElement("div");
            const wrapperClass = sender === 'user' ? 'message animate-msg user-msg-wrapper' : 'message animate-msg';
            msgDiv.className = wrapperClass;

            const avatarDiv = document.createElement("div");
            avatarDiv.className = `avatar ${sender === 'user' ? 'user-avatar' : 'ai-avatar'}`;
            avatarDiv.textContent = sender === 'user' ? 'U' : 'AI';

            const contentDiv = document.createElement("div");
            contentDiv.className = "msg-content";

            msgDiv.appendChild(avatarDiv);
            msgDiv.appendChild(contentDiv);

            if (typing.parentNode === chatContainer) {
                chatContainer.insertBefore(msgDiv, typing);
            } else {
                chatContainer.appendChild(msgDiv);
                chatContainer.appendChild(typing);
            }

            if (sender === 'user' || !animate) {
                if (typeof marked !== 'undefined') {
                    contentDiv.innerHTML = (sender === 'ai' || sender === 'model') ? marked.parse(text) : text;
                } else {
                    contentDiv.innerText = text;
                }
            } else {
                avatarDiv.classList.add('ai-thinking');

                let i = 0;
                const speed = 20;
                const chunkSize = 3;

                function typeWriter() {
                    if (i < text.length) {
                        const chunk = text.slice(0, i + chunkSize);
                        i += chunkSize;

                        if (typeof marked !== 'undefined') {
                            contentDiv.innerHTML = marked.parse(chunk);
                        } else {
                            contentDiv.innerText = chunk;
                        }

                        scrollToBottom();
                        setTimeout(typeWriter, speed);
                    } else {
                        avatarDiv.classList.remove('ai-thinking');
                        if (typeof marked !== 'undefined') {
                            contentDiv.innerHTML = marked.parse(text);
                        }
                    }
                }
                typeWriter();
            }

            scrollToBottom();
        }

        function scrollToBottom() {
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        const deleteModal = document.getElementById("deleteModal");
        const confirmDeleteBtn = document.getElementById("confirmDeleteBtn");
        const cancelDeleteBtn = document.getElementById("cancelDelete");
        const profileModal = document.getElementById("profileModal");

        function openDeleteModal(chatId) {
            chatToDeleteId = chatId;
            deleteModal.style.display = "flex";
        }
        function closeDeleteModal() {
            chatToDeleteId = null;
            deleteModal.style.display = "none";
        }
        cancelDeleteBtn.addEventListener("click", closeDeleteModal);
        confirmDeleteBtn.addEventListener("click", async () => {
            if (chatToDeleteId) {
                if (chatToDeleteId === currentChatId) resetToNewChat();
                await deleteDoc(doc(db, "users", currentUser.uid, "chats", chatToDeleteId));
                closeDeleteModal();
            }
        });

        window.addEventListener("click", (e) => {
            if (e.target == deleteModal) closeDeleteModal();
            if (e.target == profileModal) profileModal.style.display = "none";
        });

        sendBtn.onclick = handleSend;
        userInput.addEventListener("keypress", e => { if (e.key === "Enter") handleSend(); });

        const profileBtn = document.getElementById("profileBtn");
        const closeProfileBtn = document.getElementById("closeProfile");
        const logoutBtn = document.getElementById("logout");

        profileBtn.addEventListener("click", () => { profileModal.style.display = "flex"; });
        closeProfileBtn.addEventListener("click", () => { profileModal.style.display = "none"; });

        logoutBtn.addEventListener("click", () => {
            signOut(auth).then(() => {
                localStorage.removeItem("loggedInUser");
                localStorage.removeItem("loggedIn");
                window.location.href = "login.html";
            });
        });
    </script>
</body>

</html>
